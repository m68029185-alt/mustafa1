<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><title>جدول المرحلة الثانية</title>
<style>
:root{--ink:#17324d;--bg:#f4f7fb;--line:#dfe6ee;--muted:#687789;--theory:#eaf2ff;--practical:#eaf8ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182431;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.top{background:linear-gradient(135deg,var(--ink),#2e5a7b);color:#fff;padding:24px 16px 18px;border-radius:0 0 24px 24px}.wrap{max-width:900px;margin:auto;padding:0 14px 95px}
.eyebrow{font-size:12px;opacity:.8}h1{margin:5px 0;font-size:25px}.sub{font-size:13px;opacity:.86}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:15px;box-shadow:0 5px 18px #17324d0b}h2{font-size:18px;margin:0 0 12px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.group{border:0;border-radius:18px;padding:22px 10px;background:#dbe9f5;color:var(--ink);font-weight:800;font-size:21px}.group small{display:block;font-size:12px;margin-top:6px}
.subgroups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.subgroup,.day,.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px}.subgroup{font-weight:800}
.days{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.day{white-space:nowrap}.day.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.lecture{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border-radius:15px;margin:9px 0;border:1px solid var(--line)}.lecture.theory{background:var(--theory)}.lecture.practical{background:var(--practical)}
.time{font-weight:800;direction:ltr;text-align:center;background:#fff9;border-radius:10px;padding:9px 4px;font-size:12px}.type{font-size:10px;font-weight:800;margin-bottom:4px}.subject{font-weight:850;font-size:15px;direction:ltr;text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.tag{background:#ffffffb8;border:1px solid #dce3ea;border-radius:9px;padding:4px 7px;font-size:11px;color:#3b4c5c}
.empty{text-align:center;color:var(--muted);padding:30px}.credit{text-align:center;color:var(--muted);font-size:11px;padding:20px}
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5}.adminbtn{border:1px solid #d6dee7;background:#fff;color:#4b5b6a;border-radius:12px;padding:7px 12px;font-size:11px;box-shadow:0 4px 16px #0001}
dialog{border:0;border-radius:20px;max-width:720px;width:calc(100% - 24px);padding:0;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0006}.dlg{padding:18px}
label{display:block;font-size:12px;margin:9px 0;color:#455463}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{direction:ltr;text-align:left;min-height:260px;font-family:monospace;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.primary,.danger{border:0;border-radius:11px;padding:10px 13px}.primary{background:var(--ink);color:#fff}.danger{background:#feecec;color:#a22}.notice{font-size:12px;color:var(--muted);padding:10px;background:#f7f9fb;border-radius:10px;margin-top:10px}
@media(max-width:560px){.subgroups{grid-template-columns:repeat(2,1fr)}.lecture{grid-template-columns:78px 1fr}.subject{font-size:14px}}
</style></head>
<body>
<header class="top"><div class="wrap"><div class="eyebrow" id="eyebrow">كلية التقنيات الصحية والطبية</div><h1 id="title">جدول المرحلة الثانية</h1><div class="sub" id="subtitle">تقنيات المختبرات الطبية · 2026–2027</div></div></header>
<main class="wrap">
<section class="panel" id="home"><h2>اختيار الكروب</h2><div class="groups"><button class="group" onclick="chooseGroup('A')">كروب A<small>A1 – A4</small></button><button class="group" onclick="chooseGroup('B')">كروب B<small>B1 – B4</small></button></div></section>
<section class="panel" id="subPanel" hidden><h2>اختار الكروب الفرعي</h2><div class="subgroups" id="subgroups"></div></section>
<section class="panel" id="schedulePanel" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="scheduleTitle">الجدول</h2><button class="secondary" onclick="backHome()">رجوع</button></div><div class="days" id="days"></div><div id="schedule"></div></section>
<div class="credit">مصمم الموقع: <strong id="designer">مصطفى مهند حامد</strong></div></main>
<div class="bottom"><button class="adminbtn" onclick="openAdmin()">نظام الإدارة</button></div>

<dialog id="admin"><div class="dlg"><h2>نظام الإدارة</h2><form id="login"><label>اسم المستخدم<input id="user" required></label><label>الرمز<input id="pass" type="password" required></label><div class="actions"><button class="primary">دخول</button><button type="button" class="secondary" onclick="admin.close()">إغلاق</button></div><p id="loginMsg" class="notice"></p></form>
<div id="editor" hidden><h3>تعديل كامل الموقع</h3><label>عنوان الموقع<input id="eTitle"></label><label>اسم الكلية / الوصف<input id="eEyebrow"></label><label>السطر التعريفي<input id="eSubtitle"></label><label>اسم المصمم<input id="eDesigner"></label><label>بيانات الجدول كاملة<textarea id="eData"></textarea></label>
<div class="actions"><button class="primary" onclick="saveAll()">حفظ كل التعديلات</button><button class="secondary" onclick="requestNotify()">تفعيل الإشعارات</button><button class="secondary" onclick="openReminder()">إعداد التذكير</button><button class="danger" onclick="resetAll()">إرجاع الجدول الأصلي</button></div><p id="saveMsg" class="notice"></p></div></div></dialog>
<dialog id="reminder"><div class="dlg"><h2>تذكير المحاضرات</h2><label><input id="remEnabled" type="checkbox" style="width:auto"> تفعيل التذكير</label><label>التنبيه قبل المحاضرة بعدد الدقائق<input id="remMinutes" type="number" min="1" max="120" value="10"></label><div class="actions"><button class="primary" onclick="saveReminder()">حفظ</button><button class="secondary" onclick="reminder.close()">إغلاق</button></div><p class="notice">على iPhone يجب السماح بالإشعارات بعد إضافة الموقع إلى الشاشة الرئيسية.</p></div></dialog>

<script>

let app=JSON.parse(localStorage.getItem("timetableApp")||"null")||JSON.parse(JSON.stringify(ORIGINAL));
let group="",subgroup="",day="السبت";const $=id=>document.getElementById(id);
function applySite(){$("title").textContent=app.site.title;$("eyebrow").textContent=app.site.eyebrow;$("subtitle").textContent=app.site.subtitle;$("designer").textContent=app.site.designer;document.title=app.site.title}
function chooseGroup(g){group=g;$("home").hidden=true;$("subPanel").hidden=false;$("schedulePanel").hidden=true;$("subgroups").innerHTML=["1","2","3","4"].map(n=>`<button class="subgroup" onclick="chooseSub('${g}${n}')">${g}${n}</button>`).join("")}
function chooseSub(s){subgroup=s;day="السبت";$("subPanel").hidden=true;$("schedulePanel").hidden=false;render()}
function backHome(){group="";subgroup="";$("home").hidden=false;$("subPanel").hidden=true;$("schedulePanel").hidden=true}
function ti(t){let i=app.data.times.indexOf(t);return i<0?999:i}
function render(){let days=app.data.days;$("days").innerHTML=days.map(d=>`<button class="day ${d===day?"active":""}" onclick="day='${d}';render()">${d}</button>`).join("");$("scheduleTitle").textContent=`جدول ${subgroup} — ${day}`;let list=[...app.data.theory.filter(x=>x.day===day&&(x.group===group||x.group==="A&B")).map(x=>({...x,type:"theory"})),...app.data.practical.filter(x=>x.day===day&&x.group===subgroup).map(x=>({...x,type:"practical"}))].sort((a,b)=>ti(a.time)-ti(b.time));$("schedule").innerHTML=list.length?list.map(x=>`<article class="lecture ${x.type}"><div class="time">${x.time}</div><div><div class="type">${x.type==="theory"?"نظري":"عملي"}</div><div class="subject">${x.subject}</div><div class="meta"><span class="tag">الكروب: ${x.group}</span><span class="tag">القاعة: ${x.hall}</span>${x.teacher?`<span class="tag">المدرس: ${x.teacher}</span>`:""}</div></div></article>`).join(""):'<div class="empty">لا توجد محاضرات لهذا اليوم حسب الجدول.</div>'}
function openAdmin(){$("login").hidden=false;$("editor").hidden=true;$("loginMsg").textContent="";admin.showModal()}
$("login").onsubmit=e=>{e.preventDefault();if($("user").value==="mustafa2007"&&$("pass").value==="20072007"){$("login").hidden=true;$("editor").hidden=false;$("eTitle").value=app.site.title;$("eEyebrow").value=app.site.eyebrow;$("eSubtitle").value=app.site.subtitle;$("eDesigner").value=app.site.designer;$("eData").value=JSON.stringify(app.data,null,2)}else $("loginMsg").textContent="بيانات الدخول غير صحيحة."}
function saveAll(){try{let d=JSON.parse($("eData").value);if(!d.days||!d.times||!d.theory||!d.practical)throw Error("بيانات الجدول ناقصة");app={site:{title:$("eTitle").value,eyebrow:$("eEyebrow").value,subtitle:$("eSubtitle").value,designer:$("eDesigner").value},data:d};localStorage.setItem("timetableApp",JSON.stringify(app));applySite();render();$("saveMsg").textContent="تم حفظ التعديلات على هذا الجهاز."}catch(e){$("saveMsg").textContent="خطأ في البيانات: "+e.message}}
function resetAll(){if(confirm("إرجاع الجدول الأصلي؟")){localStorage.removeItem("timetableApp");app=JSON.parse(JSON.stringify(ORIGINAL));applySite();$("eData").value=JSON.stringify(app.data,null,2);$("saveMsg").textContent="تم الإرجاع."}}
async function requestNotify(){if(!("Notification"in window))return $("saveMsg").textContent="المتصفح لا يدعم الإشعارات.";$("saveMsg").textContent="حالة الإشعارات: "+await Notification.requestPermission()}
function openReminder(){let r=JSON.parse(localStorage.getItem("reminder")||"null")||{};$("remEnabled").checked=!!r.enabled;$("remMinutes").value=r.minutes||10;reminder.showModal()}
function saveReminder(){localStorage.setItem("reminder",JSON.stringify({enabled:$("remEnabled").checked,minutes:+$("remMinutes").value}));reminder.close()}
applySite();
</script></body></html>
